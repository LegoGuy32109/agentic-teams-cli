name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run release:check
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: teams-cli-linux-x64
          - os: macos-15
            target: bun-darwin-arm64
            artifact: teams-cli-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            artifact: teams-cli-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: teams-cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun test test/update.test.ts
      - run: bun build --compile --minify --target=${{ matrix.target }} --outfile=dist/${{ matrix.artifact }} index.ts
      - shell: bash
        run: |
          "./dist/${{ matrix.artifact }}" --version
          "./dist/${{ matrix.artifact }}" update --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release
        shell: bash
        run: |
          cp upstream-manifest.json install.sh install.ps1 artifacts/
          cd artifacts
          sha256sum teams-cli-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
